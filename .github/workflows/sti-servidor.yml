# Somos STI Acesso Remoto - compila o servidor (hbbs, hbbr e o painel embutido) e publica como release.
#
# Como usar: altere o número em sti/VERSAO (ex.: 2026.11.2), faça commit e push no branch "sti".
# O push desse arquivo dispara a compilação. (Com este arquivo no branch padrão, também dá para usar
# Actions > "STI - servidor" > Run workflow informando a versão.)
# Resultado: release "sti-v<versão>" com o arquivo somos-sti-servidor-<versão>-linux-amd64.tar.gz e o SHA256SUMS.
# O script sti/servidor/atualizar-servidor.sh baixa esse arquivo no servidor e confere o SHA-256.
#
# Não usa nenhum segredo: só o GITHUB_TOKEN padrão, para criar a release.
name: STI - servidor

on:
  push:
    branches:
      - sti
    paths:
      - sti/VERSAO
      - .github/workflows/sti-servidor.yml
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão da STI (ano.mês.sequência), por exemplo 2026.11.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: sti-servidor-${{ inputs.versao || github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: sqlite://${{ github.workspace }}/db_v2.sqlite3
  TARGET: x86_64-unknown-linux-musl

jobs:
  servidor:
    name: Linux amd64 (binários estáticos)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Confere o formato da versão
        env:
          VERSAO_INFORMADA: ${{ inputs.versao }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Disparo manual: usa a versão informada. Disparo por push: lê o arquivo sti/VERSAO.
          if [ -n "$VERSAO_INFORMADA" ]; then VERSAO="$VERSAO_INFORMADA"; else VERSAO="$(tr -d ' \r\n' < sti/VERSAO)"; fi
          if gh release view "sti-v$VERSAO" >/dev/null 2>&1; then
            echo "::error::a versão $VERSAO já foi publicada: aumente o número em sti/VERSAO"; exit 1; fi
          echo "$VERSAO" | grep -Eq '^[0-9]{4}\.[0-9]{1,2}\.[0-9]+$' || {
            echo "::error::use o formato ano.mês.sequência, por exemplo 2026.11.1"; exit 1; }
          echo "VERSAO=$VERSAO" >> "$GITHUB_ENV"
          echo "PACOTE=somos-sti-servidor-$VERSAO-linux-amd64" >> "$GITHUB_ENV"

      - name: Ferramentas de compilação
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: sti-servidor-${{ env.TARGET }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compila (o painel web é montado e embutido no hbbs)
        run: cargo build --release --locked --bins --target "$TARGET"

      - name: Os binários são estáticos e executam
        run: |
          bin="target/$TARGET/release"
          for b in hbbs hbbr rustdesk-utils; do
            if ldd "$bin/$b" 2>&1 | grep -qE 'not a dynamic executable|statically linked'; then
              echo "$b é estático"
            else
              echo "::error::$b não é estático"; ldd "$bin/$b"; exit 1
            fi
          done
          "$bin/hbbs" --version
          "$bin/hbbr" --version

      - name: O servidor sobe e o painel embutido é o da STI
        run: |
          # Teste de verdade: liga o servidor numa pasta vazia, só em 127.0.0.1, e pede a página do painel.
          bin="$PWD/target/$TARGET/release"
          mkdir -p "$RUNNER_TEMP/teste" && cd "$RUNNER_TEMP/teste"
          printf 'provider = []\n' > oauth2.toml
          "$bin/hbbr" > hbbr.log 2>&1 &
          API_ADDRESS=127.0.0.1 KEY=_ OAUTH2_CONFIG_FILE=oauth2.toml "$bin/hbbs" -r 127.0.0.1:21117 > hbbs.log 2>&1 &
          ok=nao
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:21114/ui/ -o painel.html 2>/dev/null; then ok=sim; break; fi
            sleep 1
          done
          [ "$ok" = sim ] || { echo "::error::o servidor não respondeu"; tail -20 hbbs.log; exit 1; }
          grep -q "Somos STI Acesso Remoto" painel.html || {
            echo "::error::o painel embutido não tem a marca da STI"; head -c 600 painel.html; exit 1; }
          # A senha de fábrica entra (banco novo) e o idioma pt-BR é aceito no perfil.
          token=$(curl -fsS -X POST http://127.0.0.1:21114/api/login -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"Hello,world!","id":"ci","uuid":"ci"}' | grep -o '"access_token":"[^"]*"' | cut -d'"' -f4)
          [ -n "$token" ] || { echo "::error::login de teste falhou"; exit 1; }
          codigo=$(curl -sS -o /dev/null -w '%{http_code}' -X PUT http://127.0.0.1:21114/api/user/profile \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d '{"language":"pt-BR"}')
          [ "$codigo" = 200 ] || { echo "::error::o servidor recusou o idioma pt-BR (HTTP $codigo)"; exit 1; }
          pkill hbbs || true; pkill hbbr || true
          echo "Painel da STI respondendo, login e pt-BR conferidos."

      - name: Monta o pacote
        run: |
          mkdir -p "dist/$PACOTE"
          cp "target/$TARGET/release/hbbs" "target/$TARGET/release/hbbr" "target/$TARGET/release/rustdesk-utils" "dist/$PACOTE/"
          cp LICENSE "dist/$PACOTE/LICENSE"
          printf 'Somos STI Acesso Remoto - servidor %s\nCommit: %s\nCódigo-fonte: %s/%s\nLicença: AGPL-3.0 (ver LICENSE)\n' \
            "$VERSAO" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" > "dist/$PACOTE/VERSAO.txt"
          tar -C dist -czf "dist/$PACOTE.tar.gz" "$PACOTE"
          (cd dist && sha256sum "$PACOTE.tar.gz" > SHA256SUMS && cat SHA256SUMS)

      - name: Publica a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "sti-v$VERSAO" "dist/$PACOTE.tar.gz" dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "Somos STI Acesso Remoto - servidor $VERSAO" \
            --notes "Servidor (hbbs, hbbr) com o painel da STI embutido. Binários estáticos para Linux amd64. Confira o SHA-256 antes de instalar."
